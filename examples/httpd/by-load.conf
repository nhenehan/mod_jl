# Load-based member selection: each request goes to the instance with the
# fewest requests in progress, weighted by lbfactor.
#
# Busyness suits work whose cost varies (some requests take a millisecond,
# some a second) and Julia's garbage collection pauses: a worker that is
# collecting holds on to its requests, its busy count rises, and new
# requests go elsewhere until it catches up.
#
# Include it from your httpd configuration, inside a <VirtualHost> or not.

<IfModule !slotmem_shm_module>
    LoadModule slotmem_shm_module modules/mod_slotmem_shm.so
</IfModule>
<IfModule !jl_module>
    LoadModule jl_module modules/mod_jl.so
</IfModule>

Define REPORTS_SECRET change-me

# ping_mode=A checks a connection before every request (about 30 us), so a
# worker that has stopped answering is noticed within ping_timeout and
# skipped, instead of holding requests until socket_timeout.
#
# r3 runs on a machine with twice the cores: lbfactor=2 gives it twice the
# share. r4 is a standby on another host: distance=1 keeps it idle while
# any of r1-r3 is up.
JlWorker r1 unix:/run/reports/r1.sock secret=${REPORTS_SECRET} ping_mode=A ping_timeout=2
JlWorker r2 unix:/run/reports/r2.sock secret=${REPORTS_SECRET} ping_mode=A ping_timeout=2
JlWorker r3 tcp://10.0.0.13:7801 secret=${REPORTS_SECRET} ping_mode=A ping_timeout=2
JlWorker r4 tcp://10.0.0.14:7801 secret=${REPORTS_SECRET} ping_mode=A ping_timeout=2

# No sessions to keep together: sticky_session=off. A worker that fails is
# skipped for recover_time, then one request tries it again.
JlBalancer reports method=Busyness sticky_session=off recover_time=30
JlBalancerMember reports r1
JlBalancerMember reports r2
JlBalancerMember reports r3 lbfactor=2
JlBalancerMember reports r4 distance=1

JlMount /reports/* reports
