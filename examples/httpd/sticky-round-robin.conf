# Round robin with sticky sessions across three JlServ instances of one
# application.
#
# The instances are jlserv@1, jlserv@2 and jlserv@3 (see jlserv@.service),
# each on its own Unix socket. Requests are shared out in turn; a request
# whose session id ends in ".j2" (as session_id(req) makes them on j2) goes
# back to j2 for as long as j2 is up, and to another instance when it isn't.
#
# Include it from your httpd configuration, inside a <VirtualHost> or not.

<IfModule !slotmem_shm_module>
    LoadModule slotmem_shm_module modules/mod_slotmem_shm.so
</IfModule>
<IfModule !jl_module>
    LoadModule jl_module modules/mod_jl.so
</IfModule>

# The secret the instances get as JL_SECRET (EnvironmentFile in the unit).
Define MYAPP_SECRET change-me

# A JlWorker's name is also its route, the suffix of the session ids it
# hands out. Give each instance a name that stays the same across restarts.
JlWorker j1 unix:/run/myapp/j1.sock secret=${MYAPP_SECRET}
JlWorker j2 unix:/run/myapp/j2.sock secret=${MYAPP_SECRET}
JlWorker j3 unix:/run/myapp/j3.sock secret=${MYAPP_SECRET}

# Requests: each instance in turn (weighted by lbfactor, 1 for all here).
# sticky_session is on by default; the session id is the JSESSIONID cookie,
# or a ;jsessionid= path parameter. With sticky_session_force=on, a request
# whose instance is down gets a 503 instead of going to another one: use it
# only if sessions can't move between instances at all.
JlBalancer myapp method=Requests sticky_session=on session_cookie=JSESSIONID
JlBalancerMember myapp j1
JlBalancerMember myapp j2
JlBalancerMember myapp j3

JlMount /myapp/* myapp
